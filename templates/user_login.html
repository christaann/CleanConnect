{% extends "base.html" %}
{% block title %}User Login - CleanConnect{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🔑</div>
            <h1>Welcome Back</h1>
            <p>Login to submit and track your complaints</p>
        </div>

        <form action="{{ url_for('user_login') }}" method="POST" class="auth-form">

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" id="email"
                       placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="password"
                           placeholder="Enter your password" required>
                    <button type="button" class="toggle-pwd" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="auth-footer">
            <p class="hint-text">Don't have an account?</p>
            <a href="{{ url_for('register') }}" class="back-link">
                <i class="fas fa-user-plus"></i> Register here
            </a>
            <br><br>
            <a href="{{ url_for('home') }}" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
function togglePwd() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
{% endblock %}
